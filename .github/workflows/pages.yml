# Deploys the website (site/, described in docs/WEBSITE.md) to GitHub Pages at
# https://passtunnel.github.io/passtunnel/. Runs on every push to main that touches site/, so the site
# always describes the released app (site changes go out with the next release merge), and by hand
# (Actions → Pages → Run workflow, on main). The build job runs scripts/check-site.sh and uploads site/
# as the Pages artifact with read-only access; only the deploy job may write to Pages.
#
# Repository settings: Pages → Source → GitHub Actions, and the environment "github-pages" must allow
# deployments from main.
name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the site
        run: scripts/check-site.sh

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write          # publish the artifact to Pages
      id-token: write       # prove the deployment's origin to Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
