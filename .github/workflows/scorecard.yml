# OpenSSF Scorecard: checks the repository's supply-chain practices (pinned actions, token
# permissions, branch protection, signed releases, …), publishes the result to the public Scorecard
# API (for the badge, api.scorecard.dev) and uploads it to code scanning (Security → Code scanning).
# Runs on pushes to the default branch (dev), weekly, and when branch protection changes.
#
# With publish_results the Scorecard API only accepts results from a workflow that follows its rules:
# no workflow-level env or defaults and no write permissions at workflow level; the job runs on
# Ubuntu, has no env, defaults, containers or services, is the only one with id-token: write, and
# uses only actions/checkout, actions/upload-artifact, github/codeql-action/upload-sarif and
# ossf/scorecard-action. Keep it that way when editing this file.
name: Scorecard

on:
  push:
    branches: [dev]
  schedule:
    - cron: "17 4 * * 1"
  branch_protection_rule:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write   # upload the SARIF to code scanning
      id-token: write          # publish_results: proves the result comes from this workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the SARIF file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
