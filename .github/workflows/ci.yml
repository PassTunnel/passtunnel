# Builds and tests every pull request into dev or main and every push to them. The job names are
# required status checks in the branch rulesets, so renaming a job means updating the rulesets too:
#
#   Build and test    swift build and swift test on macOS (Apple silicon), and the PassTunnelKit
#                     library built for iOS (the iPhone app uses it)
#   Linux (x86_64)    PassTunnelKit built and its tests run (the golden cases in fixtures/) on
#   Linux (aarch64)   Linux, in the official Swift container; Package.swift has nothing else there
#   Release scripts   shellcheck of next-version.sh and its test, and the self-test of
#                     scripts/next-version.sh (in a temporary repository)
#   Site              shellcheck of the site scripts and scripts/check-site.sh, the static checks
#                     of the website in site/ (docs/WEBSITE.md)
#
# The checks of the pull request itself (title, linked issue, source branch) are in
# pull-request.yml, which also runs when the title, body or base branch is edited. A newer push to a
# pull request cancels the run of the older one; runs on dev and main always finish.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      # The tests isolate themselves (PASSTUNNEL_HOME and PASSTUNNEL_KEYCHAIN_SERVICE per test).
      - name: Test
        run: swift test

      # The portable library must keep building for the iPhone app (docs/MOBILE.md).
      - name: Build PassTunnelKit for iOS
        run: xcodebuild -scheme PassTunnelKit -destination 'generic/platform=iOS Simulator' -quiet build

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    container:
      # swift:6.4.1-noble, pinned by the digest of its multi-arch index (both architectures).
      image: swift:6.4.1-noble@sha256:19cbe56bdaec1918f7cf5fdeba42b9bd55bdd8a6149c9990d0e0e3a89a127d63
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show the toolchain
        run: |
          uname -m
          swift --version

      - name: Build PassTunnelKit
        run: swift build --target PassTunnelKit

      # On Linux this is PassTunnelKitTests only.
      - name: Test
        run: swift test

  scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: shellcheck --version && shellcheck scripts/next-version.sh scripts/test-next-version.sh

      - name: Self-test of next-version.sh
        run: scripts/test-next-version.sh

  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: shellcheck --version && shellcheck scripts/check-site.sh scripts/site-assets.sh

      - name: Check the site
        run: scripts/check-site.sh

  # Temporary probes for the pull request (removed before review).
  probe:
    name: Probe (temporary)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    container:
      image: swift:6.4.1-noble@sha256:19cbe56bdaec1918f7cf5fdeba42b9bd55bdd8a6149c9990d0e0e3a89a127d63
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Does a Linux build rewrite Package.resolved
        continue-on-error: true
        run: |
          cp Package.resolved /tmp/Package.resolved.orig
          swift package resolve
          if diff /tmp/Package.resolved.orig Package.resolved; then echo "Package.resolved unchanged"; else echo "Package.resolved rewritten"; fi
          cp /tmp/Package.resolved.orig Package.resolved

      - name: Typecheck PassTunnelShared and PassTunnelCore as one module, without the Apple-only imports
        continue-on-error: true
        run: |
          mkdir -p Sources/CoreProbe
          for f in Sources/PassTunnelShared/*.swift Sources/PassTunnelCore/*.swift; do
            out="Sources/CoreProbe/$(basename "$(dirname "$f")")-$(basename "$f")"
            sed -E -e 's/^import CryptoKit$/import Crypto/' -e 's/^import Darwin$/import Glibc/' \
              -e '/^import (Combine|Security|LocalAuthentication|ServiceManagement|Network|Vision|ImageIO|CoreGraphics|CoreServices|PassTunnelShared)$/d' \
              "$f" > "$out"
          done
          swift build --target PassTunnelKit
          bin="$(swift build --show-bin-path)"
          find "$bin" -maxdepth 2 -name "*.swiftmodule"
          swiftc -typecheck -no-color-diagnostics -swift-version 5 -module-name CoreProbe -package-name passtunnel \
            -I "$bin" -I "$bin/Modules" -Xcc -I"$bin/include" Sources/CoreProbe/*.swift 2>&1 | tee /tmp/core-probe.log

      - name: Errors
        if: always()
        run: |
          grep -E ': error: ' /tmp/core-probe.log | sed -E 's|^.*/Sources/CoreProbe/||' | sort -u || true
