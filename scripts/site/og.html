<!doctype html>
<!-- Source of site/assets/img/og.png (1200x630), the image link previews show. Not published:
     scripts/site-assets.sh renders it with headless Chrome after converting the screenshots it uses. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>PassTunnel social preview</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #ffffff; }

    position: relative;

  h1 { margin-top: 56px; font-size: 58px; line-height: 1.04; font-weight: 500; letter-spacing: -0.045em; }
  p { margin-top: 28px; font-size: 22px; line-height: 1.45; color: #454545; }
  .shot {
    position: absolute; left: 648px; top: 96px; width: 552px; height: auto;
    border-radius: 16px;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08), 0 40px 80px -30px rgba(0, 0, 0, 0.35);
  }
</style>
</head>
<body>
  <div class="glow"></div>

    <div class="brand"><img src="../../site/assets/img/app-icon-72@2x.webp" alt="">PassTunnel</div>

</html>
