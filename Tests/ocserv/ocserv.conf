# ocserv for PassTunnel's end-to-end tests (Tests/ocserv/README.md). TEST ONLY.

# The password (ocpasswd), then a second form for the TOTP code (the oath users file: HOTP/T30/6, a
# 30-second TOTP with 6 digits). ocserv records the last code used in the file and refuses it again.
auth = "plain[passwd=/etc/ocserv/ocpasswd,otp=/var/lib/ocserv/users.oath]"

tcp-port = 443
udp-port = 443
run-as-user = nobody
run-as-group = nogroup
socket-file = /run/ocserv.socket
pid-file = /run/ocserv.pid
server-cert = /etc/ocserv/server-cert.pem
server-key = /etc/ocserv/server-key.pem
# Containers often refuse the worker's seccomp filter.
isolate-workers = false
use-occtl = true

max-clients = 16
max-same-clients = 0
# The tests fail sign-ins on purpose, one after the other, from one address: no ban, no wait.
max-ban-score = 0
min-reauth-time = 0
auth-timeout = 60
cookie-timeout = 60
deny-roaming = false
keepalive = 30
dpd = 30
mobile-dpd = 30
try-mtu-discovery = false
tls-priorities = "NORMAL:%SERVER_PRECEDENCE"
cisco-client-compat = true
dtls-legacy = true

# What the client's hook has to set up: an address of each family, routes into the tunnel (split
# include), one left out of it (split exclude), a DNS server inside the tunnel for the split DNS domain,
# and a default domain. The tunnel's servers are addresses of the container's own (entrypoint.sh), so the
# tunnel reaches them without forwarding. Away from the networks of the CI runners (10.1.0.0/16),
# Docker's (172.16.0.0/12) and the tunnel job's (172.31.211.0/24).
device = vpns
predictable-ips = true
ipv4-network = 10.211.0.0/24
ipv6-network = fd42:211::/48
ipv6-subnet-prefix = 64
route = 10.212.0.0/16
route = fd42:212::/48
no-route = 10.212.99.0/24
dns = 10.212.0.53
split-dns = corp.example.com
default-domain = corp.example.com
