# The tunnel's DNS server (Tests/ocserv/README.md). TEST ONLY. It answers for corp.example.com itself
# and refuses everything else, so a test sees which server a name went to.
listen-address=10.212.0.53,fd42:212::53
bind-interfaces
no-resolv
no-hosts
local=/corp.example.com/
address=/intranet.corp.example.com/10.212.0.80
address=/intranet.corp.example.com/fd42:212::80
log-queries
log-facility=-
